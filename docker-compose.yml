version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amin-shop-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - /var/www/html/vendor
      - /var/www/html/node_modules
    networks:
      - amin-shop-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=amin_shop
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis

  nginx:
    image: nginx:alpine
    container_name: amin-shop-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./storage/app/public:/var/www/html/storage/app/public
    networks:
      - amin-shop-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: amin-shop-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: amin_shop
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: aminshop
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - amin-shop-network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    container_name: amin-shop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - amin-shop-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amin-shop-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "sleep 10 && php artisan queue:work --sleep=3 --tries=3 --timeout=90"
    volumes:
      - .:/var/www/html
    networks:
      - amin-shop-network
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=amin_shop
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amin-shop-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "sleep 10 && while true; do
        php artisan schedule:run >> /var/log/scheduler.log 2>&1;
        sleep 60;
      done"
    volumes:
      - .:/var/www/html
    networks:
      - amin-shop-network
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=amin_shop
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis

networks:
  amin-shop-network:
    driver: bridge

volumes:
  db_data: